configure terminal

! 1. Nome padrão inicial do switch
hostname SW-LAB-02

! 2. Desativa resolução de DNS indesejada para evitar travamentos na CLI
no ip domain-lookup

! 3. Configura domínio IP (necessário para gerar chaves RSA)
ip domain-name netops.local

! 4. Criação de usuário administrativo com privilégio 15
username admin privilege 15 secret Admin@123

! 5. Habilita senha secreta global de Enable
enable secret Admin@123

! 6. Configuração de Linha de Console (evita timeout e poluição de logs)
line con 0
 exec-timeout 0 0
 logging synchronous
 login local

! 7. Configuração de Linhas VTY (SSH) para acesso remoto pelo Portal
line vty 0 4
 transport input ssh
 login local

! 8. Geração de chaves RSA e Habilitação obrigatória do SSH v2
crypto key generate rsa modulus 2048
ip ssh version 2

! 9. Configuração opcional de IP de gerência (caso utilize a interface Management / vlan de gerência)
interface Ethernet0/0
no switchport
ip address 192.168.0.249 255.255.255.0
no shutdown

! 10. Configurar porta conectada ao firewall  como trunk
interface Ethernet1/0
switchport mode trunk

end
write memory