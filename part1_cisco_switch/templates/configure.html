<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar Switch Cisco - NetOps Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #f8fafc; }
        .form-control, .form-select { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; }
        .form-control:focus, .form-select:focus { background-color: #0f172a; color: #f8fafc; border-color: #38bdf8; box-shadow: none; }
        #terminal {
            background-color: #020617;
            color: #22c55e;
            font-family: 'Courier New', Courier, monospace;
            height: 450px;
            overflow-y: auto;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            white-space: pre-wrap;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="/">⚡ NetOps Automation Portal</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link active" href="/configure-page">Switches Cisco</a>
                <a class="nav-link" href="/backups">Backups</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Banner de Alerta Dinâmico no Frontend -->
        <div id="validationBanner" class="alert d-none fw-bold shadow-sm mb-4" role="alert"></div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card p-4 shadow">
                    <h4 class="mb-3 text-info">Parâmetros do Switch</h4>
                    <form id="configForm">
                        <div class="mb-3">
                            <label class="form-label">Endereço IP (Management)</label>
                            <input type="text" id="host" class="form-control" value="192.168.0.248" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Hostname Alvo</label>
                            <input type="text" id="hostname" class="form-control" value="SWITCH_AUTOMATIZADO" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Usuário SSH</label>
                                <input type="text" id="username" class="form-control" value="admin" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Senha SSH</label>
                                <input type="password" id="password" class="form-control" value="" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha Enable (Opcional)</label>
                            <input type="password" id="enable_password" class="form-control" placeholder="Deixe vazio se priv 15">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Perfil de Criptografia SSH</label>
                            <select id="ssh_profile" class="form-select">
                                <option value="legacy" selected>Laboratório / Legado (Cisco IOL / vIOS)</option>
                                <option value="modern">Produção / Moderno (Catalyst / Nexus)</option>
                            </select>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="button" id="btnApply" class="btn btn-success fw-bold" onclick="submitAction('apply')">
                                🚀 APPLY (Provisionar VLANs & Portas)
                            </button>
                            <button type="button" id="btnAudit" class="btn btn-info text-dark fw-bold" onclick="submitAction('audit')">
                                🔍 AUDITAR CONFORMIDADE (Validar Estado)
                            </button>
                            <button type="button" id="btnRemove" class="btn btn-outline-danger fw-bold" onclick="submitAction('remove')">
                                🔄 ROLLBACK (Restaurar Padrão)
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card p-4 shadow">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0 text-info">Console de Execução em Tempo Real</h4>
                        <button class="btn btn-sm btn-outline-secondary" onclick="clearTerminal()">Limpar Log</button>
                    </div>
                    <div id="terminal">Aguardando comando de execução...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        const terminal = document.getElementById("terminal");
        const banner = document.getElementById("validationBanner");
        const btnApply = document.getElementById("btnApply");
        const btnAudit = document.getElementById("btnAudit");
        const btnRemove = document.getElementById("btnRemove");

        function appendLog(text) {
            terminal.textContent += "\n" + text;
            terminal.scrollTop = terminal.scrollHeight;
        }

        function clearTerminal() {
            terminal.textContent = "Console limpo. Pronto para nova execução.";
            banner.classList.add("d-none");
        }

        function setButtonsState(disabled) {
            btnApply.disabled = disabled;
            btnAudit.disabled = disabled;
            btnRemove.disabled = disabled;
        }

        socket.on("log_message", (msg) => {
            appendLog(msg.data);
        });

        socket.on("config_finished", (res) => {
            setButtonsState(false);
            banner.classList.remove("d-none", "alert-success", "alert-danger");

            if (res.success) {
                banner.classList.add("alert-success");
                banner.textContent = "✅ " + (res.message || "Operação concluída e validada com sucesso!");
                appendLog("\n==========================================");
                appendLog("✅ OPERAÇÃO FINALIZADA COM ÊXITO!");
                appendLog("==========================================");
            } else {
                banner.classList.add("alert-danger");
                banner.textContent = "🚨 ALERTA DE VALIDAÇÃO: " + (res.message || "Divergência ou falha detectada. Verifique os detalhes no console abaixo.");
                appendLog("\n==========================================");
                appendLog("⚠️ OPERAÇÃO FINALIZADA COM ALERTAS OU ERROS.");
                appendLog("==========================================");
            }
        });

        function submitAction(action) {
            const payload = {
                host: document.getElementById("host").value,
                hostname: document.getElementById("hostname").value,
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                enable_password: document.getElementById("enable_password").value,
                ssh_profile: document.getElementById("ssh_profile").value,
                action: action
            };

            banner.classList.add("d-none");
            terminal.textContent = `[System] Iniciando conexão SSH e requisição de ${action.toUpperCase()}...`;
            setButtonsState(true);
            socket.emit("start_config", payload);
        }
    </script>
</body>
</html>
