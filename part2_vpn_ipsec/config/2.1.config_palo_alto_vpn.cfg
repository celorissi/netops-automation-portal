configure

# ==========================================
# 1. INTERFACES, IPS E ZONAS
# ==========================================
set network interface ethernet ethernet1/1 layer3 ip 10.0.20.1/24
set network interface ethernet ethernet1/2 layer3 ip 172.16.100.2/30
set network interface tunnel units tunnel.1

# Associa interfaces ao Virtual Router padrão
set network virtual-router default interface [ ethernet1/1 ethernet1/2 tunnel.1 ]

# Perfis de Gerenciamento e Ping
set network profiles interface-management-profile PERMITE_PING ping yes
set network interface ethernet ethernet1/1 layer3 interface-management-profile PERMITE_PING
set network interface ethernet ethernet1/2 layer3 interface-management-profile PERMITE_PING
set network interface tunnel units tunnel.1 interface-management-profile MGMT-PING

# Criação e Associação das Zonas
set zone zone-lan network layer3 ethernet1/1
set zone zone_wan network layer3 ethernet1/2
set zone zone-vpn network layer3 tunnel.1

# ==========================================
# 2. PERFIS CRIPTOGRÁFICOS (IKEv2 & IPsec)
# ==========================================
set network ike crypto-profiles ike-crypto-profiles Fortinet hash sha256
set network ike crypto-profiles ike-crypto-profiles Fortinet dh-group group14
set network ike crypto-profiles ike-crypto-profiles Fortinet encryption des
set network ike crypto-profiles ike-crypto-profiles Fortinet lifetime seconds 28800

set network ike crypto-profiles ipsec-crypto-profiles Fortinet esp encryption des
set network ike crypto-profiles ipsec-crypto-profiles Fortinet esp authentication sha256
set network ike crypto-profiles ipsec-crypto-profiles Fortinet dh-group group14
set network ike crypto-profiles ipsec-crypto-profiles Fortinet lifetime seconds 3600

# ==========================================
# 3. IKE GATEWAY (Fase 1)
# ==========================================
set network ike gateway Fortinet peer-address ip 172.16.100.1
set network ike gateway Fortinet local-address interface ethernet1/2
set network ike gateway Fortinet local-address ip 172.16.100.2/30
set network ike gateway Fortinet authentication pre-shared-key key -AQ==opxXxolN7m6CUVENWMBweO4/Sb8=56UyyadbKtxIqlbOyH7ZWQ==
set network ike gateway Fortinet protocol ikev2 ike-crypto-profile Fortinet
set network ike gateway Fortinet protocol version ikev2
set network ike gateway Fortinet protocol ikev2 dpd enable yes

# ==========================================
# 4. TÚNEL IPSEC & PROXY-IDS (Fase 2)
# ==========================================
set network tunnel ipsec Fortinet auto-key ike-gateway Fortinet 
set network tunnel ipsec Fortinet auto-key ipsec-crypto-profile Fortinet
set network tunnel ipsec Fortinet auto-key proxy-id Fortinet protocol any 
set network tunnel ipsec Fortinet auto-key proxy-id Fortinet local 10.0.20.0/24
set network tunnel ipsec Fortinet auto-key proxy-id Fortinet remote 10.0.10.0/24
set network tunnel ipsec Fortinet tunnel-interface tunnel.1

# ==========================================
# 5. ROTEAMENTO ESTÁTICO
# ==========================================
set network virtual-router default routing-table ip static-route Fortinet nexthop ip-address 172.16.100.1
set network virtual-router default routing-table ip static-route Fortinet interface tunnel.1
set network virtual-router default routing-table ip static-route Fortinet metric 10
set network virtual-router default routing-table ip static-route Fortinet destination 10.0.10.0/24

# ==========================================
# 6. POLÍTICAS DE SEGURANÇA
# ==========================================
set rulebase security rules ALLOW-IKE-IPSEC action allow
set rulebase security rules ALLOW-IKE-IPSEC from zone_wan
set rulebase security rules ALLOW-IKE-IPSEC to zone_wan
set rulebase security rules ALLOW-IKE-IPSEC application [ ike ipsec ]
set rulebase security rules ALLOW-IKE-IPSEC service any
set rulebase security rules ALLOW-IKE-IPSEC source any
set rulebase security rules ALLOW-IKE-IPSEC destination any

set rulebase security rules LAN-TO-VPN action allow
set rulebase security rules LAN-TO-VPN from zone-lan
set rulebase security rules LAN-TO-VPN to zone-vpn
set rulebase security rules LAN-TO-VPN application any
set rulebase security rules LAN-TO-VPN service any
set rulebase security rules LAN-TO-VPN source any
set rulebase security rules LAN-TO-VPN destination any

set rulebase security rules VPN-TO-LAN action allow
set rulebase security rules VPN-TO-LAN from zone-vpn
set rulebase security rules VPN-TO-LAN to zone-lan
set rulebase security rules VPN-TO-LAN application any
set rulebase security rules VPN-TO-LAN service any
set rulebase security rules VPN-TO-LAN source any
set rulebase security rules VPN-TO-LAN destination any

commit