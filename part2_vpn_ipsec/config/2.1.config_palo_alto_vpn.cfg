configure
# Configuração de Interfaces e Zonas
set network interface ethernet ethernet1/1 layer3 ip 10.0.20.1/24
set network interface ethernet ethernet1/2 layer3 ip 100.64.100.2/30
set network interface tunnel units tunnel.1 ip 169.254.100.2/30
set network interface tunnel units tunnel.1 interface-management-profile MGMT-PING
set zone LAN-ZONE network layer3 ethernet1/1
set zone zone-wan network layer3 ethernet1/2
set zone zone-vpn network layer3 tunnel.1

# 1. Criação do Management Profile permitindo ping
set network profiles interface-management-profile MGMT-PING ping yes

# 2. Aplicação do perfil na interface de túnel
set network interface tunnel units tunnel.1 interface-management-profile MGMT-PING

# Perfis Criptográficos (IKE e IPsec)
set network ike crypto-profiles ike-crypto-profiles fgt-ike-profile hash [ md5 sha1 ]
set network ike crypto-profiles ike-crypto-profiles fgt-ike-profile dh-group group2
set network ike crypto-profiles ike-crypto-profiles fgt-ike-profile encryption des
set network ike crypto-profiles ike-crypto-profiles fgt-ike-profile lifetime seconds 28800

set network ike crypto-profiles ipsec-crypto-profiles fgt-ipsec-profile esp encryption des
set network ike crypto-profiles ipsec-crypto-profiles fgt-ipsec-profile esp authentication [ md5 sha1 ]
set network ike crypto-profiles ipsec-crypto-profiles fgt-ipsec-profile dh-group group2
set network ike crypto-profiles ipsec-crypto-profiles fgt-ipsec-profile lifetime seconds 43200

# IKE Gateway
set network ike gateway FGT-TO-PA-VPN peer-address ip 100.64.100.1
set network ike gateway FGT-TO-PA-VPN local-address interface ethernet1/2
set network ike gateway FGT-TO-PA-VPN local-address ip 100.64.100.2/30
set network ike gateway FGT-TO-PA-VPN authentication pre-shared-key key -AQ==opxXxolN7m6CUVENWMBweO4/Sb8=56UyyadbKtxIqlbOyH7ZWQ==
set network ike gateway FGT-TO-PA-VPN protocol ikev2 ike-crypto-profile fgt-ike-profile
set network ike gateway FGT-TO-PA-VPN protocol version ikev2

set network ike gateway FGT-TO-PA-VPN protocol ikev2 ike-crypto-profile fgt-ike-profile
set network ike gateway FGT-TO-PA-VPN protocol version ikev2

# Túnel IPsec & Proxy-IDs
set network tunnel ipsec FGT-TO-PA-VPN auto-key ike-gateway FGT-TO-PA-VPN 
set network tunnel ipsec FGT-TO-PA-VPN auto-key proxy-id fgt protocol any 
set network tunnel ipsec FGT-TO-PA-VPN auto-key proxy-id fgt local 10.0.20.0/24
set network tunnel ipsec FGT-TO-PA-VPN auto-key proxy-id fgt remote 10.0.10.0/24
set network tunnel ipsec FGT-TO-PA-VPN tunnel-interface tunnel.1

# Roteamento Estático
set network virtual-router default interface [ tunnel.1 ]
set network virtual-router default routing-table ip static-route FGT-LAN nexthop ip-address 169.254.100.1
set network virtual-router default routing-table ip static-route FGT-LAN interface tunnel.1
set network virtual-router default routing-table ip static-route FGT-LAN metric 10
set network virtual-router default routing-table ip static-route FGT-LAN destination 10.0.10.0/24

set network virtual-router default routing-table ip static-route FGT-PEER nexthop ip-address 100.64.100.1
set network virtual-router default routing-table ip static-route FGT-PEER interface ethernet1/2
set network virtual-router default routing-table ip static-route FGT-PEER metric 10
set network virtual-router default routing-table ip static-route FGT-PEER destination 100.64.100.1/32

# Security Policies (Regras de Segurança)
set rulebase security rules ALLO-IPSEC application [ ike ipsec ]
set rulebase security rules ALLO-IPSEC from zone-wan
set rulebase security rules ALLO-IPSEC to zone-wan
set rulebase security rules ALLO-IPSEC source any
set rulebase security rules ALLO-IPSEC destination any
set rulebase security rules ALLO-IPSEC action allow

set rulebase security rules LAN-to-VPN from LAN-ZONE
set rulebase security rules LAN-to-VPN to zone-vpn
set rulebase security rules LAN-to-VPN source any
set rulebase security rules LAN-to-VPN destination any
set rulebase security rules LAN-to-VPN application any
set rulebase security rules LAN-to-VPN action allow

set rulebase security rules VPN-to-LAN from zone-vpn
set rulebase security rules VPN-to-LAN to LAN-ZONE
set rulebase security rules VPN-to-LAN source any
set rulebase security rules VPN-to-LAN destination any
set rulebase security rules VPN-to-LAN application any
set rulebase security rules VPN-to-LAN action allow

set rulebase security rules ALLO-IPSEC service any
set rulebase security rules LAN-to-VPN service any
set rulebase security rules VPN-to-LAN service any
commit