


# VPN IPsec - Phase 1 (IKEv2)
config vpn ipsec phase1-interface
    edit "FGT-TO-PA-VPN"
        set interface "port2"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device enable
        set proposal des-md5 des-sha1
        set dhgrp 2
        set remote-gw 100.64.100.2
        set psksecret -AQ==opxXxolN7m6CUVENWMBweO4/Sb8=56UyyadbKtxIqlbOyH7ZWQ==
    next
end

# VPN IPsec - Phase 2
config vpn ipsec phase2-interface
    edit "FGT-TO-PA-VPN"
        set phase1name "FGT-TO-PA-VPN"
        set proposal des-md5 des-sha1
        set dhgrp 2
        set src-subnet 10.0.10.0 255.255.255.0
        set dst-subnet 10.0.20.0 255.255.255.0
    next
end

# Configuração das Interfaces de Rede (WAN no bloco /30 e Loop/Túnel)
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.0.251 255.255.255.0
        set allowaccess ping https ssh http fgfm
        set type physical
    next
    edit "port2"
        set vdom "root"
        set ip 100.64.100.1 255.255.255.252
        set allowaccess ping https ssh
        set type physical
        set alias "WAN"
    next
    edit "FGT-TO-PA-VPN"
        set vdom "root"
        set ip 169.254.100.1 255.255.255.255
        set type tunnel
        set remote-ip 169.254.100.2 255.255.255.255
        set allowaccess ping
        set interface "port2"
    next
end

# Roteamento Estático
config router static
    edit 0
        set dst 10.0.20.0 255.255.255.0
        set device "FGT-TO-PA-VPN"
    next
end


# Firewall Policies 
config firewall policy
    edit 1
        set name "FGT_TO_PA_OUT"
        set srcintf "port3"
        set dstintf "FGT-TO-PA-VPN"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
    edit 2
        set name "FGT_TO_PA_IN"
        set srcintf "FGT-TO-PA-VPN"
        set dstintf "port3"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
    next
end