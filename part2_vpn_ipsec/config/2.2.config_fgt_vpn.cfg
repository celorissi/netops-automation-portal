# ==========================================
# 1. INTERFACES WAN E LAN
# ==========================================
config system interface
    edit "port1"
        set mode static
        set ip 192.168.0.251 255.255.255.0
        set allowaccess ping https ssh http fgfm
    next
    edit "port2"
        set mode static
        set ip 172.16.100.1 255.255.255.252
        set allowaccess ping https ssh
    next
    edit "port3"
        set mode static
        set ip 10.0.10.1 255.255.255.0
        set allowaccess ping https ssh http
    next
end

# ==========================================
# 2. OBJETOS DE ENDEREÇO E GRUPOS
# ==========================================
config firewall address
    edit "palo-alto_local_subnet_1"
        set subnet 10.0.10.0 255.255.255.0
        set allow-routing enable
    next
    edit "palo-alto_remote_subnet_1"
        set subnet 10.0.20.0 255.255.255.0
        set allow-routing enable
    next
end

config firewall addrgrp
    edit "palo-alto_local"
        set member "palo-alto_local_subnet_1"
        set comment "VPN: palo-alto"
        set allow-routing enable
    next
    edit "palo-alto_remote"
        set member "palo-alto_remote_subnet_1"
        set comment "VPN: palo-alto"
        set allow-routing enable
    next
end

# ==========================================
# 3. IPSEC PHASE 1 & PHASE 2 (IKEv2)
# (Cria automaticamente a interface virtual "palo-alto")
# ==========================================
config vpn ipsec phase1-interface
    edit "palo-alto"
        set interface "port2"
        set ike-version 2
        set keylife 28800
        set peertype any
        set net-device disable
        set proposal des-sha256
        set comments "VPN: palo-alto"
        set dhgrp 14
        set remote-gw 172.16.100.2
        set psksecret Admin@123
    next
end

config vpn ipsec phase2-interface
    edit "palo-alto"
        set phase1name "palo-alto"
        set proposal des-sha256
        set dhgrp 14
        set comments "VPN: palo-alto"
        set keylifeseconds 3600
        set src-addr-type name
        set src-name "palo-alto_local"
        set dst-addr-type name
        set dst-name "palo-alto_remote"
    next
end

# ==========================================
# 4. ROTEAMENTO ESTÁTICO
# ==========================================
config router static
    edit 2
        set device "palo-alto"
        set comment "VPN: palo-alto"
        set dstaddr "palo-alto_remote"
    next
    edit 3
        set distance 254
        set comment "VPN: palo-alto"
        set blackhole enable
        set dstaddr "palo-alto_remote"
    next
end

# ==========================================
# 5. POLÍTICAS DE SEGURANÇA
# ==========================================
config firewall policy
    edit 1
        set name "vpn_palo-alto_local"
        set srcintf "port3"
        set dstintf "palo-alto"
        set srcaddr "palo-alto_local"
        set dstaddr "palo-alto_remote"
        set action accept
        set schedule "always"
        set service "ALL"
        set comments "VPN: palo-alto"
    next
    edit 2
        set name "vpn_palo-alto_remote"
        set srcintf "palo-alto"
        set dstintf "port3"
        set srcaddr "palo-alto_remote"
        set dstaddr "palo-alto_local"
        set action accept
        set schedule "always"
        set service "ALL"
        set comments "VPN: palo-alto"
    next
end