# Rollback / Exclusão de LAN e DHCP no Palo Alto
# Etapa 0: Desativar interface logicamente
set network interface ethernet ethernet1/1 state down

# Etapa 1: Remover DHCP e dessassociar do Virtual Router
delete network dhcp interface ethernet1/1
delete network virtual-router default interface ethernet1/1

# Etapa 2: Remover Zona, Interface Layer3 e Perfil de Gerenciamento
delete zone LAN-ZONE
delete network interface ethernet ethernet1/1 layer3
delete network profiles interface-management-profile PERMITE_PING