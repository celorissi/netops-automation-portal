# 1. Remover as políticas de firewall criadas para o túnel
config firewall policy
    delete 1
    delete 2
end

# 2. Remover rotas estáticas
config router static
    delete 2
end

# 3. Remover interfaces IPsec Phase 2 e Phase 1 (antes da interface virtual)
config vpn ipsec phase2-interface
    delete "FGT-TO-PA-VPN"
end

config vpn ipsec phase1-interface
    delete "FGT-TO-PA-VPN"
end

# 4. Remover a interface de túnel virtual e limpar o alias da port2
config system interface
    delete "FGT-TO-PA-VPN"
    edit "port2"
        unset alias
    next
end