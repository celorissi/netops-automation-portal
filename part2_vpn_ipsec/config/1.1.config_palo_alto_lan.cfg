# Configuração de LAN / DHCP para Palo Alto
set network profiles interface-management-profile PERMITE_PING ping yes
set network interface ethernet ethernet1/1 layer3 ip 10.0.20.1/24
set network interface ethernet ethernet1/1 layer3 interface-management-profile PERMITE_PING
set zone zone-lan network layer3 [ ethernet1/1 ]
set network virtual-router default interface [ ethernet1/1 ]
set network dhcp interface ethernet1/1 server ip-pool 10.0.20.50-10.0.20.150
set network dhcp interface ethernet1/1 server option gateway 10.0.20.1
set network dhcp interface ethernet1/1 server option subnet-mask 255.255.255.0
set network dhcp interface ethernet1/1 server mode auto