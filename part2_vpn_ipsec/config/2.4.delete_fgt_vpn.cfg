# 1. Remover as referências da tunnel.1 (evita o erro de dependência)
delete import network interface tunnel.1
delete network virtual-router default interface tunnel.1

# 2. Remover as Security Policies criadas
delete rulebase security rules ALLO-IPSEC
delete rulebase security rules LAN-to-VPN
delete rulebase security rules VPN-to-LAN

# 3. Remover rotas estáticas do Virtual Router
delete network virtual-router default routing-table ip static-route FGT-LAN
delete network virtual-router default routing-table ip static-route FGT-PEER

# 4. Remover o túnel IPsec, IKE Gateway e Perfis Criptográficos customizados
delete network tunnel ipsec FGT-TO-PA-VPN
delete network ike gateway FGT-TO-PA-VPN
delete network ike crypto-profiles ike-crypto-profiles fgt-ike-profile
delete network ike crypto-profiles ipsec-crypto-profiles fgt-ipsec-profile

# 5. Remover as zonas personalizadas
delete zone LAN-ZONE
delete zone zone-wan
delete zone zone-vpn

# 6. Remover a interface túnel e limpar o IP da ethernet1/2
delete network interface tunnel units tunnel.1
delete network interface ethernet ethernet1/2 layer3 ip 172.16.100.2/30

