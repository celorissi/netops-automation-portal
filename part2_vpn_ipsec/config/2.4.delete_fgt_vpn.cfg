# 1. Remove as políticas específicas da VPN (evita o prompt interativo do purge)
config firewall policy
    delete 1
    delete 2
end

# 2. Remove as rotas estáticas associadas ao túnel
config router static
    delete 2
    delete 3
end

# 3. Remove a Fase 2 e a Fase 1 do IPsec
config vpn ipsec phase2-interface
    delete "palo-alto"
end

config vpn ipsec phase1-interface
    delete "palo-alto"
end

# 4. Remove a interface virtual de túnel
config system interface
    delete "palo-alto"
end

# 5. Remove os grupos de endereços (agora sem dependências ativas)
config firewall addrgrp
    delete "palo-alto_local"
    delete "palo-alto_remote"
end

# 6. Por fim, remove os objetos de endereço base
config firewall address
    delete "palo-alto_local_subnet_1"
    delete "palo-alto_remote_subnet_1"
end