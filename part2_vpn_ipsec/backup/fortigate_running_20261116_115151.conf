<html><head><meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"><style type=\"text/css\">html,body{height:100%;padding:0;margin:0;}.oc{display:table;width:100%;height:100%;}.ic{display:table-cell;vertical-align:middle;height:100%;}form{display:block;background:#ccc;border:2px solid red;padding:0 0 25px 0;width:500px;font-family:helvetica,sans-serif;font-size:14px;margin:10px auto;}.fel,.fer,.fec{text-align:center;width:350px;margin:0 auto;padding:10px;}.fel{text-align:left;}.fer{text-align:right;}h1{font-weight:bold;font-size:21px;margin:0;padding:20px 10px;text-align:center;}p{margin:15px auto;width:75%;text-align:left;}ul{margin:15px auto;width:75%;}h2{margin:25px 10px;font-weight:bold;text-align:center;}label,h2{font-size:16px;}.logo{background:#eee center 25px url(%%IMAGE:logo_fw_auth%%) no-repeat;padding-top:80px;}</style><title>Firewall Authentication</title></head><body><div class=\"oc\"><div class=\"ic\"><form action=\"/\" method=\"post\" onsubmit=\'return form_check();\'><input type=\"hidden\" name=\"%%USERNAMEID%%\" value=\"%%USERNAMEVAL%%\"><input type=\"hidden\" name=\"%%REQUESTID%%\" value=\"%%REQUESTVAL%%\"><input type=\"hidden\" name=\"%%USERGROUPID%%\" value=\"%%USERGROUPVAL%%\"><input type=\"hidden\" name=\"%%REDIRID%%\" value=\"%%PROTURI%%\"><input type=\"hidden\" name=\"%%MAGICID%%\" value=\"%%MAGICVAL%%\"><h1 class=\"logo\">Authentication Required</h1><h2><script type=\"text/javascript\">var expire_days = %%EXPIREDAYS%%;if (expire_days < 0) {  document.write(\"Your password has expired.\"); }else if (expire_days == 0) {  document.write(\"Your password is expiring.\"); }else if (expire_days == 1) {  document.write(\"Your password will expire in 1 day.\"); }else {  document.write(\"Your password will expire in %%EXPIREDAYS%% days.\"); }</script><br>Please set a new one.</h2><div class=\"fer\"><label for=\"ft_pd\">New password:</label> <input name=\"%%PASSWORDID%%\" id=\"ft_pd\" type=\"password\" autocomplete=\"off\" style=\"width:230px\" onkeydown=\"keydownhandler(event)\"></div><div class=\"fer\"><label for=\"ft_pd\">Re-enter:</label> <input name=\"password2\" id=\"ft_pd\" type=\"password\" autocomplete=\"off\" style=\"width:230px\" onkeydown=\"keydownhandler(event)\"></div><div class=\"fer\"><input type=\"button\" id=\"skip\" value=\"Skip\" onclick=\"form.%%PASSWORDID%%.value=\'\'; form.password2.value=\'\'; form.submit();\">  <input type=\"submit\" id=\"continue\" value=\"Continue\"></div></form><script language=\"javascript\">document.forms[0].skip.focus(); function keydownhandler(event){if (event.keyCode == 13) document.forms[0].continue.focus();} function form_check(){  var form=document.forms[0];  if (form.%%PASSWORDID%%.value != form.password2.value)  {    alert(\'The entered passwords do not match\');    return false;  }  return true;}
