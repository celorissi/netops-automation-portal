<html><head><meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"><style type=\"text/css\">html,body{height:100%;padding:0;margin:0;}.oc{display:table;width:100%;height:100%;}.ic{display:table-cell;vertical-align:middle;height:100%;}form{display:block;background:#ccc;border:2px solid red;padding:0 0 25px 0;width:500px;font-family:helvetica,sans-serif;font-size:14px;margin:10px auto;}.fel,.fer,.fec{text-align:center;width:350px;margin:0 auto;padding:10px;}.fel{text-align:left;}.fer{text-align:right;}h1{font-weight:bold;font-size:21px;margin:0;padding:20px 10px;text-align:center;}p{margin:15px auto;width:75%;text-align:left;}ul{margin:15px auto;width:75%;}h2{margin:25px 10px;font-weight:bold;text-align:center;}label,h2{font-size:16px;}.logo{background:#eee center 25px url(%%IMAGE:logo_fw_auth%%) no-repeat;padding-top:80px;}</style><title>Firewall Authentication</title></head><body><div class=\"oc\"><div class=\"ic\"><form action=\"%%AUTH_POST_URL%%\" method=\"post\"><input type=\"hidden\" name=\"%%REDIRID%%\" value=\"%%PROTURI%%\"><input type=\"hidden\" name=\"%%MAGICID%%\" value=\"%%MAGICVAL%%\"><input type=\"hidden\" name=\"%%METHODID%%\" value=\"%%METHODVAL%%\"><h1 class=\"logo\">Authentication Required</h1><h2>%%QUESTION%%</h2><div class=\"fel\"><label for=\"ft_un\">Username:</label> <input name=\"%%USERNAMEID%%\" id=\"ft_un\" type=\"text\" autocorrect=\"off\" autocapitalize=\"off\" style=\"width:230px\"><br></div><div class=\"fel\"><label for=\"ft_pd\">Password:</label> <input name=\"%%PASSWORDID%%\" id=\"ft_pd\" type=\"password\" autocomplete=\"off\" style=\"width:230px\"></div><div class=\"fel\"><input type=\"submit\" value= \"Continue\">Or log in using <a href=\"%%AUTH_SAML%%\">SAML Identity Provider</a></div></form></div></div></body></html>"
    set header http
    set format html
end
config system replacemsg sslvpn "sslvpn-login"
    set buffer "<!DOCTYPE html>
<html lang=\"en\" class=\"main-app\">
    <head>
        <meta charset=\"UTF-8\">
        <meta http-equiv=\"X-UA-Compatible\" content=\"IE=8; IE=EDGE\">
        <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
        <meta name=\"apple-itunes-app\" content=\"app-id=1475674905\">
        <link href=\"/css/main-blue.css\" rel=\"stylesheet\" type=\"text/css\">
        <title>Please Login</title>
    </head>
    <body>
        <div class=\"view-container\">
            <form class=\"prompt\" action=\"%%SSL_ACT%%\" method=\"%%SSL_METHOD%%\" name=\"f\" autocomplete=\"off\">
                <div class=\"content with-header\">
                    <div class=\"header\">
                        <f-icon class=\"ftnt-fortinet-grid icon-xl\"></f-icon>
                        <div id=\"login-login\">Please Login</div>
                    </div>
                    <div class=\"sub-content\">
                        <div class=\"wide-inputs\">
                            %%SSL_LOGIN%%
                        </div>
                        <div class=\"button-actions wide\">
                            <button class=\"primary\" type=\"button\" name=\"login_button\" id=\"login_button\" onClick=\"try_login()\">
                                Login
                            </button>
                            <button type=\"button\" name=\"skip_button\" id=\"skip_button\" onClick=\"try_skip()\" style=\"display:none\">
                                Skip
                            </button>
                            <button id=\"launch-forticlient-button\" type=\"button\" onClick=\"launchFortiClient()\">
                                <f-icon class=\"ftnt-forticlient\"></f-icon>
                                <span>Launch FortiClient</span>
                            </button>
                            <iframe id=\"launch-forticlient-iframe\" style=\"display:none\"></iframe>
			    <button id=\"saml-login-bn\" class=\"primary\" type=\"button\" name=\"saml_login_bn\" onClick=\"launchSamlLogin()\"  style=\"display:none\">
				SAML Login
			    </button>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </body>
    %%SSL_HIDDEN%%
</html>
"
    set header http
    set format html
end
